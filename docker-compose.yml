name: webadmin
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www/html
    environment: &app-env
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: QuanLyCuaHangVai
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD:-root}
      APP_URL: ${APP_URL:-http://localhost:8082}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-AURA MINIMAL}
      # Cấu hình ngân hàng nhận thanh toán VietQR
      BANK_ID: ${BANK_ID:-}
      BANK_NAME: ${BANK_NAME:-}
      BANK_ACCOUNT: ${BANK_ACCOUNT:-}
      BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:-}
      BANK_QR_TEMPLATE: ${BANK_QR_TEMPLATE:-compact2}
      BANK_WEBHOOK_KEY: ${BANK_WEBHOOK_KEY:-aura-demo-key}
      PAYMENT_DEMO_CONFIRM: ${PAYMENT_DEMO_CONFIRM:-true}
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8002:80"
    volumes:
      - ./:/var/www/html
    environment: *app-env
    depends_on:
      mysql:
        condition: service_healthy

  order-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["/bin/sh", "-c", "while true; do php /var/www/html/backend/scripts/auto_confirm_deliveries.php || true; sleep 60; done"]
    volumes:
      - ./:/var/www/html
    environment: *app-env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports:
      - "8083:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: QuanLyCuaHangVai
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/migrations/schema_mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/migrations/20261103_admin_lookbook_affiliate.sql:/docker-entrypoint-initdb.d/02-admin-operations.sql:ro
      - ./backend/database/migrations/20261104_lookbook_affiliate_seed.sql:/docker-entrypoint-initdb.d/03-lookbook-affiliate-seed.sql:ro
      - ./backend/database/migrations/add_auth_tables.sql:/docker-entrypoint-initdb.d/04-auth-tables.sql:ro
      - ./backend/database/migrations/20261108_gio_hang_thanh_toan.sql:/docker-entrypoint-initdb.d/05-cart-checkout.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql_data:
